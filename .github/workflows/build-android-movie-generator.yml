name: Build & Release Android Movie Generator

on:
  push:
    branches:
      - claude/ai-movie-generator-UOfrz
    paths:
      - "android_movie_generator/**"
      - ".github/workflows/build-android-movie-generator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest already has Android SDK; just need to accept licences
      # and install the specific platform our compileSdk=34 needs.
      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # Use Gradle from the wrapper (gradle-wrapper.jar is committed in the repo)
      - name: Make gradlew executable
        run: chmod +x android_movie_generator/gradlew

      - name: Build debug APK
        working-directory: android_movie_generator
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Rename APK
        run: |
          cp android_movie_generator/app/build/outputs/apk/debug/app-debug.apk \
             MovieGenerator-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieGenerator-android
          path: MovieGenerator-android.apk
          retention-days: 7

  release:
    name: Add APK to Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MovieGenerator-android
          path: dist

      - name: Show files
        run: ls -lh dist/

      - name: Upload APK to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload movie-generator-latest \
            dist/MovieGenerator-android.apk \
            --repo "${{ github.repository }}" \
            --clobber
