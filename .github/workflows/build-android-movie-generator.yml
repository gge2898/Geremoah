name: Build & Release Android Movie Generator

on:
  push:
    branches:
      - claude/ai-movie-generator-UOfrz
    paths:
      - "android_movie_generator/**"
      - ".github/workflows/build-android-movie-generator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android_movie_generator/gradlew

      - name: Build debug APK
        working-directory: android_movie_generator
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android_movie_generator/app/build/outputs/apk/debug/app-debug.apk \
             MovieGenerator-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieGenerator-android
          path: MovieGenerator-android.apk
          retention-days: 7

  release:
    name: Add APK to Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MovieGenerator-android
          path: dist

      - name: Show files
        run: ls -lh dist/

      - name: Upload APK to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove old Android asset if it exists, then upload the new one
          gh release upload movie-generator-latest \
            dist/MovieGenerator-android.apk \
            --repo "${{ github.repository }}" \
            --clobber
