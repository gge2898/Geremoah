name: Build & Release APK

on:
  push:
    branches:
      - main
      - claude/ai-vision-computer-control-qdoCV
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AIControl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AIControl-APK
          path: dist/AIControl.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            ## AI Control — Android App

            Download **AIControl.apk** and install it on your phone.

            ### Install
            1. Download `AIControl.apk`
            2. Open it on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Requirements
            - Android 9+ (API 28) for Bluetooth HID
            - Android 14+ on Pixel 8/9 or Galaxy S24 for on-device AI (Gemini Nano)

            ### How it works
            - **Nothing needed on the computer** — the phone pairs as a Bluetooth keyboard/mouse
            - Point the phone camera at the computer screen
            - Type a task — AI sees the screen and controls the computer
          files: dist/AIControl.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
