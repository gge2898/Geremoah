name: Build & Release APK

on:
  push:
    branches:
      - main
      - claude/ai-vision-computer-control-qdoCV
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Write local.properties (point to GitHub Actions Android SDK)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/AIControl.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIControl-APK
          path: artifacts/AIControl.apk
          retention-days: 30

      # Create / update a GitHub Release with the APK attached.
      # Runs on every push to the branch (updates "latest" pre-release)
      # and on every version tag (creates a proper release).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            ## AI Control Android App

            Download **AIControl.apk** below and install it on your Android phone.

            ### Install instructions
            1. Download `AIControl.apk`
            2. Open it on your Android device
            3. Tap **Install** (you may need to allow "Install from unknown sources" in Settings → Security)

            ### Before connecting
            Make sure the computer agent is running — see the [README](../../blob/main/README.md) for setup steps.
          files: artifacts/AIControl.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
